<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1EADF">
<meta name="description" content="Thirty days of attention: one lap, one sit at a time.">
<title>Attention</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="trail" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1-9 9"/><path d="M12 8a4 4 0 1 1-4 4"/></svg>
    <span>Today</span>
  </button>
  <button type="button" class="tab tab-main" id="checkinBtn" aria-label="Mindful check-in now">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/></svg>
    <span>Check in</span>
  </button>
  <button type="button" data-tab="log" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>
    <span>Insights</span>
  </button>
  <button type="button" data-tab="settings" class="tab">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
    <span>Reminders</span>
  </button>
</nav>

<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
