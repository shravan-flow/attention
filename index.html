<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF1E3">
<meta name="description" content="Thirty days of attention: mindful pings, movement snacks and a fit plan.">
<title>Attention</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" href="fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <button type="button" data-tab="trail" class="tab" aria-label="Today">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><i></i>
  </button>
  <button type="button" data-tab="fit" class="tab" aria-label="Fit">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h3l2-5 4 10 2-5h5"/></svg><i></i>
  </button>
  <button type="button" class="tab tab-main" id="checkinBtn" aria-label="Mindful check-in now">
    <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" class="fill"/></svg></span>
  </button>
  <button type="button" data-tab="log" class="tab" aria-label="Insights">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V11M12 19V5M19 19v-6"/></svg><i></i>
  </button>
  <button type="button" data-tab="settings" class="tab" aria-label="Settings">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><i></i>
  </button>
</nav>

<button type="button" id="notesFab" class="fab" aria-label="Notes: scribble pad and journal">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 7l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
</button>

<button type="button" id="visionEye" class="veye" aria-label="View your vision boards" hidden>
  <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
</button>

<div id="sheet" class="sheetwrap" hidden>
  <div class="dim"></div>
  <section class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="shead">
      <div class="grab" aria-hidden="true"></div>
      <div class="srow"><h2 class="stitle display" id="sheetTitle"></h2><span class="scap cap"></span><button type="button" class="sclose" aria-label="Close">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button></div>
    </div>
    <div class="sbody"></div>
  </section>
</div>

<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
